name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
      
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: santhoshkaleru
          password: dckr_pat_SXdYQAIX2tnMx9ycobhmiY41AM0
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: santhoshkaleru/santhosh_devops_ui:latest

  deploy-to-ec2:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22 
          script: |
            # Pull the latest image
            docker pull santhoshkaleru/santhosh_devops_ui:latest
            # Stop and remove the old container if it exists
            docker stop demo3 || true
            docker rm demo3 || true
            # Run the new container
            docker run -d -p 80:80 --name demo3 --restart always santhoshkaleru/santhosh_devops_ui:latest